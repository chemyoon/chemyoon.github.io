<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>과학 자습 지원 프로그램</title>
  <style>
    body { font-family: 'Pretendard', sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.7; }
    h1 { color: #2563eb; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin: 15px 0; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>🔬 전농중학교 과학 학습실</h1>
  <p>안녕하세요! 중·고등 과학 학습 자료를 모아두는 공간입니다.</p>

  <div class="card">
    <h2>📘 중학교 과학</h2>
    <p>과학1</p>
    <p>과학2</p>
    <p>과학3</p>
  </div>

  <div class="card">
    <h2>📗 고등학교 과학</h2>
    <p>통합과학</p>
    <p>물리학</p>
    <p>화학</p>
    <p>생명과학</p>
    <p>지구과학</p>
    <p>융합과학</p>
  </div>

  <div class="card">
    <h2>🧪 실험실</h2>
    <p>온라인 시뮬레이션 모음 (준비 중)</p>
  </div>
</body>
</html>
